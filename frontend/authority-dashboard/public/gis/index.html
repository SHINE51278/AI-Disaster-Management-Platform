<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disaster Management GIS Map</title>

    <!-- Leaflet CSS -->
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
    <style>
        .gis-marker {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
}

.incident-marker {
    background: #dc2626;
}

.shelter-marker {
    background: #16a34a;
}

.hospital-marker {
    background: #2563eb;
}

.location-marker {
    background: #7c3aed;
}
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .map-header {
            padding: 16px 24px;
            background: #1f2937;
            color: white;
        }

        .map-header h1 {
            margin: 0;
            font-size: 22px;
        }

        .map-header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        #map {
            width: 100%;
            height: calc(100vh - 82px);
        }
    </style>
    <script src="config.js"></script>
    <script src="data/incidents.js"></script>
<script src="data/shelters.js"></script>
<script src="data/hospitals.js"></script>


</head>

<body>

    <header class="map-header">
        <h1>Disaster Management Interactive Map</h1>
        <p>Incidents • Shelters • Hospitals • User Location</p>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // --------------------------------------------------
        // 1. Initialize map
        // --------------------------------------------------

        const map = L.map("map").setView([17.3850, 78.4867], 12);


        // --------------------------------------------------
        // 2. OpenStreetMap base layer
        // --------------------------------------------------

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        // --------------------------------------------------
        // 3. Marker groups
        // --------------------------------------------------

        const incidentLayer = L.layerGroup().addTo(map);

        const shelterLayer = L.layerGroup().addTo(map);

        const hospitalLayer = L.layerGroup().addTo(map);

        const userLocationLayer = L.layerGroup().addTo(map);
	const riskZoneLayer = L.layerGroup().addTo(map);

                // --------------------------------------------------
        // Custom GIS marker icons
        // --------------------------------------------------

        const incidentIcon = L.divIcon({
            className: "",
            html: '<div class="gis-marker incident-marker">!</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        const shelterIcon = L.divIcon({
            className: "",
            html: '<div class="gis-marker shelter-marker">S</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        const hospitalIcon = L.divIcon({
            className: "",
            html: '<div class="gis-marker hospital-marker">H</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        const locationIcon = L.divIcon({
            className: "",
            html: '<div class="gis-marker location-marker">●</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });


       // --------------------------------------------------
// 4. Incident markers
// --------------------------------------------------

function addIncidentMarker(incident) {

    const latitude = Number(incident.latitude);
    const longitude = Number(incident.longitude);

    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
        console.warn("Skipping incident with invalid coordinates:", incident);
        return;
    }

    const title = incident.title || incident.name || "Incident";

    const description =
        incident.description || "No description available";

    const disasterType =
        incident.disaster_type || incident.type || "UNKNOWN";

    const severity =
        incident.severity || "UNKNOWN";

    const status =
        incident.status || "UNKNOWN";

    const priority =
        incident.priority_score ?? "N/A";

    L.marker(
        [latitude, longitude],
        { icon: incidentIcon }
    )
        .bindPopup(`
            <strong>${title}</strong><br>
            Type: ${disasterType}<br>
            Severity: ${severity}<br>
            Status: ${status}<br>
            Priority: ${priority}<br>
            ${description}
        `)
        .addTo(incidentLayer);
}


// Existing demo incidents
incidents.forEach(addIncidentMarker);


// Live backend incidents
async function loadLiveIncidents() {

    const token = localStorage.getItem("access_token");

    if (!token) {
        console.warn(
            "No authentication token found. Using demo incidents."
        );
        return;
    }

    try {

        const response = await fetch(
            `${GIS_CONFIG.API_BASE_URL}/incidents/active`,
            {
                headers: {
                    "Accept": "application/json",
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {
            throw new Error(
                `Incident API returned ${response.status}`
            );
        }

        const liveIncidents = await response.json();

        console.log(
            "Live incidents received:",
            liveIncidents
        );

        liveIncidents.forEach(addIncidentMarker);

    } catch (error) {

        console.error(
            "Unable to load live incidents. Demo incidents remain visible:",
            error
        );

    }
}

loadLiveIncidents();


// --------------------------------------------------
// Live Risk Zones
// --------------------------------------------------

async function loadLiveRiskZones() {

    const token = localStorage.getItem("access_token");

    if (!token) {
        console.warn(
            "No authentication token found. Risk zones will not load."
        );
        return;
    }

    try {

        const response = await fetch(
            `${GIS_CONFIG.API_BASE_URL}/risk-zones`,
            {
                headers: {
                    "Accept": "application/json",
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {
            throw new Error(
                `Risk Zone API returned ${response.status}`
            );
        }

        const riskZones = await response.json();

        console.log(
            "Risk zones received:",
            riskZones
        );

        const now = new Date();

        riskZones.forEach((zone) => {

            const validFrom = new Date(zone.valid_from);

            const validUntil = zone.valid_until
                ? new Date(zone.valid_until)
                : null;

            // Ignore zones that are not currently valid.
            if (validFrom > now) {
                return;
            }

            if (validUntil && validUntil < now) {
                console.log(
                    "Skipping expired risk zone:",
                    zone.id
                );
                return;
            }

            let fillColor = "#22c55e";

            if (zone.risk_level === "CRITICAL") {
                fillColor = "#991b1b";
            } else if (zone.risk_level === "HIGH") {
                fillColor = "#dc2626";
            } else if (zone.risk_level === "MEDIUM") {
                fillColor = "#f59e0b";
            }

            L.geoJSON(
                zone.geometry,
                {
                    style: {
                        color: fillColor,
                        fillColor: fillColor,
                        fillOpacity: 0.35,
                        weight: 3
                    },

                onEachFeature: function (feature, layer) {

    layer.bindPopup(`
        <strong>Risk Zone</strong><br>
        Disaster: ${zone.disaster_type}<br>
        Risk Score: ${zone.risk_score}<br>
        Risk Level: ${zone.risk_level}<br>
        Valid From: ${zone.valid_from}<br>
        Valid Until: ${
            zone.valid_until ?? "No expiry"
        }
    `);

}


            }).addTo(riskZoneLayer);

        });

    } catch (error) {

        console.error(
            "Unable to load risk zones:",
            error
        );

    }
}

loadLiveRiskZones();

        // --------------------------------------------------
        // 5. Demo shelter markers
        // --------------------------------------------------

       

        shelters.forEach((shelter) => {

            L.marker([
                shelter.latitude,
                shelter.longitude
            ], { icon: shelterIcon })
            .bindPopup(
                `<strong>Shelter</strong><br>${shelter.name}`
            )
            .addTo(shelterLayer);

        });


        // --------------------------------------------------
        // 6. Demo hospital markers
        // --------------------------------------------------

       

        hospitals.forEach((hospital) => {

            L.marker([
                hospital.latitude,
                hospital.longitude
            ], { icon: hospitalIcon })
            .bindPopup(
                `<strong>Hospital</strong><br>${hospital.name}`
            )
            .addTo(hospitalLayer);

        });


        // --------------------------------------------------
        // 7. User location
        // --------------------------------------------------

if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        function (position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
const userMarker = L.marker(
    [
        latitude,
        longitude
    ],
    {
        icon: locationIcon
    }
).addTo(userLocationLayer);
            userMarker.bindPopup("Your Location");

            // Keep the map centered on the demo area.
            // The user's location is still displayed as a marker.
        },
        function (error) {
            console.error("Geolocation error:", error);
        }
    );
}else {

            console.log(
                "Geolocation is not supported by this browser."
            );

        }

// --------------------------------------------------
// Backend configuration test
// --------------------------------------------------

console.log("GIS Backend:", GIS_CONFIG.API_BASE_URL);

        // --------------------------------------------------
        // 8. Layer control
        // --------------------------------------------------

       const overlays = {

    "Incidents": incidentLayer,

    "Shelters": shelterLayer,

    "Hospitals": hospitalLayer,

    "Risk Zones": riskZoneLayer,

    "My Location": userLocationLayer

};
        L.control.layers(null, overlays).addTo(map);

    </script>


</body>
</html>
